[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solbeat"
version = "0.1.0"
description = "A quiet, durable wake gate for local agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yu and Sol"}]
dependencies = []

[project.scripts]
solbeat = "solbeat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solbeat = ["default.toml"]
