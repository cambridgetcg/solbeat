# This repository is the only writable project root for unattended turns.
# Approval policy is left to whoever runs Codex here; the unattended runner
# sets it in its own Codex profile.
sandbox_mode = "workspace-write"
allow_login_shell = false
model_reasoning_effort = "medium"
web_search = "disabled"

[sandbox_workspace_write]
writable_roots = ["/Users/yu/.hermes/profiles/sol/solbeat"]
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[mcp_servers.openaiDeveloperDocs]
enabled = false
